<script>
  /* One-click install: capture the browser's install offer immediately, before the app loads. */
  window.__bip = null;
  addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__bip = e; dispatchEvent(new Event('wayof-installable')); });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('./sw.js').catch(function () {});
</script>
